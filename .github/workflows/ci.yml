# Every test the repository has, on every push and pull request:
#
#   rust       cargo fmt, clippy, cargo test (offline and quick)
#   e2e        cargo test -- --ignored: the holder binding proved, and the devnet test (a node spawned,
#              the pool deployed, Alice and Bob registering and transacting, every balance checked)
#   commitlint conventional commits (pull requests)
#
# The circuits and the contract are emit-protocol's, checked in its own CI; emit-devnet takes its
# crates from crates.io.
#
# No job measures time or memory: the demo's timings are for the README, not for CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    name: Commit lint (conventional-commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emit-devnet
    steps:
      - uses: actions/checkout@v5
        with:
          path: emit-devnet
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rust-src-dir: emit-devnet
      # noir-zk-backend links bb's static library against libc++.
      - name: Install libc++
        run: sudo apt-get update -q && sudo apt-get install -yq libc++-dev libc++abi-dev
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  e2e:
    name: Proving and the devnet (cargo test -- --ignored)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emit-devnet
    steps:
      - uses: actions/checkout@v5
        with:
          path: emit-devnet
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: emit-devnet
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install libc++
        run: sudo apt-get update -q && sudo apt-get install -yq libc++-dev libc++abi-dev
      - name: Cache the bb CRS
        uses: actions/cache@v4
        with:
          path: ~/.bb-crs
          key: noir-zk-srs-0f238856e557-72b8cdad9da8
      - name: Provision the SRS noir-zk pins
        run: scripts/srs.sh
      - name: The holder binding, proved
        run: cargo test -p zkpool -- --ignored holder
      - name: The devnet end to end
        run: cargo test -p emit-devnet-node -- --ignored devnet --nocapture
