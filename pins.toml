# Everything the devnet trusts, in one place. Compiled into the node and the wallet
# (crates/circuits/src/pins.rs) and checked at startup: local pins against the layers compiled in
# and the roots the codegen computed, remote ones by fetching each file and checking its SHA-256
# and contents. Changing a layer's version means changing it here and in Cargo.toml together.

[noir-zk]
# From crates.io; every layer is bound with it.
version = "0.3.0"
# noir-zk-kernels/kernels/step: the last leaf of every pipeline root.
kernels_family_root = "0x0eb7f8157a5b52a81ce181f7dca9e0190e738dc5cb41dde4d3fdde618b84937f"

[emit]
# This repository's layers (crates/circuits/noir), frozen by `noir-zk freeze`: the transfer apps
# (emit/transfer, emit/transfer_holder) and the identity cache (identity_cache/register, member).
library = "emit-devnet@0.2.0"
[emit.family_roots]
transfer = "0x101453d93d091f5a72b40bbe6cc5b63d076638c8d301e87ef52c91f006f2c2b6"
transfer_holder = "0x09d917b9f08bcc54c20a273541ee956f011b4e42308e90665cd78e5326040106"
register = "0x15c06b7f80000624cd9456db6fae7ddefa38c988dcdb265bf035816c45482247"
member = "0x180deeffbc118baf6fc3585c1d9a935c598a636f7d06604082550c99ec2cce09"

[zk-encryption]
# v0.1.0's circuits (families and pins unchanged), consumed from PR #1's branch on noir-zk 0.3.0.
library = "zk-encryption@0.1.0"
catalog = "https://circuits.zk-experiments.dev/zk-encryption/0.1.0/catalog.json"
catalog_sha256 = "bbf6cd45d558dca42c6e8999a60cc89e3aa0e956a99263e2a74ea4c4ebd79153"

[eid]
# The identity layer, v0.8.0: its DSC, SOD and document steps from the release's packs.
library = "eid-circuits@0.8.0"
packs = "https://circuits.zk-eid.dev"
catalog = "https://circuits.zk-eid.dev/catalog@0.8.0.json"
catalog_sha256 = "f91190637a0845061649f7935872e2070468c7bd7b7d9ebe99510178b917e092"

[csca]
# The published CSCA registry release (the devnet also accepts the synthetic fixtures' root).
tag = "registry-20260928-1039"
root = "0x27bef40a340b61d7d2f0b9da4d05fe3f635b272c38292de11dbb50273ec202a2"
registry = "https://registry.zk-eid.dev/registry-20260928-1039/registry.json"
registry_sha256 = "17a21c0f7997de83a7ebc9296b6a041dc84286e4805374037faac6dd8bcf4444"

[deployment]
root = "0x04f06ffbe5280984001601db1b671c259bfd4febd6d94223190768efda8abdb9"
identity_transfer = { root = "0x2e18854ae8917020c91f87b84e3b576391859af989581f05d8514669502d968b", length = 7 }
transfer_only = { root = "0x1cd91016c533ab0d8d0a25a240adc78fe9032e6775bbba787f6aa15ce97014d4", length = 3 }
identity_register = { root = "0x22c0bc718c6a58f348c250b3fda9bf9ae23db58d90f8c67e48d12bc375eb1066", length = 4 }
member_transfer = { root = "0x26af3817f97c3f41ebd476c820fc5f6451c63e6b4229b7e088817196096d26cb", length = 5 }
