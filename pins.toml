# Everything the devnet trusts, in one place. Compiled into the node and the wallet
# (crates/circuits/src/pins.rs) and checked at startup: local pins against the layers compiled in
# and the roots the codegen computed, remote ones by fetching each file and checking its SHA-256
# and contents. Changing a layer's version means changing it here and in Cargo.toml together.

[noir-zk]
# From crates.io; every layer is bound with it.
version = "0.3.3"
# noir-zk-kernels/kernels/step: the last leaf of every pipeline root.
kernels_family_root = "0x297133fa2fe6ee1897087e26d3c5e6d6a1316195d7fad3d34809c182a341ae43"

[emit]
# This repository's layers (crates/circuits/noir), frozen by `noir-zk freeze`: the transfer app
# (emit/transfer_holder) and the identity cache (identity_cache/register, member).
library = "emit-devnet@0.2.0"
[emit.family_roots]
transfer_holder = "0x2a50870b6c65dbb363bb5627a4c435e670f942247560a698d10f61056ff4e27a"
register = "0x127dc46e65a5b323265eab1bd7eb35f5291cebbda35a56d35252c8af63846c41"
member = "0x03f6f1875f4202a360af7b6cc88c52d3cee772896e97181466c8f9bcd15864be"

[zk-encryption]
# Release v0.1.3 (git tag, on noir-zk 0.3.3), frozen as zk-encryption@0.1.3.
release = "0.1.3"
library = "zk-encryption@0.1.3"
catalog = "https://circuits.zk-experiments.dev/zk-encryption/0.1.3/catalog.json"
catalog_sha256 = "5bb7d1b5d253d49c8ba0c4d974b73270a58c4535ef4dc9861f2be9214e9bb2c5"

[eid]
# The identity layer, v0.8.2 (on noir-zk 0.3.3): its DSC, SOD and document steps from the release's packs.
library = "eid-circuits@0.8.2"
packs = "https://circuits.zk-eid.dev"
catalog = "https://circuits.zk-eid.dev/catalog@0.8.2.json"
catalog_sha256 = "4de0e4f0a6a03e64e7cdcf0c724901c6b2cb0f742184a46d750f935c856753eb"

[csca]
# The published CSCA registry release (the devnet also accepts the synthetic fixtures' root).
tag = "registry-20260928-1039"
root = "0x27bef40a340b61d7d2f0b9da4d05fe3f635b272c38292de11dbb50273ec202a2"
registry = "https://registry.zk-eid.dev/registry-20260928-1039/registry.json"
registry_sha256 = "17a21c0f7997de83a7ebc9296b6a041dc84286e4805374037faac6dd8bcf4444"

[deployment]
root = "0x26c8ef8078714da209ce35c2012a5f91a87aa8de58546937c0ceb68bd8c49bf5"
identity_register = { root = "0x25bcf9604364971c2f6d153e68114723a12f0a5bfe72d0f930bfd13769d45730", length = 4 }
member_transfer = { root = "0x0bb7cc32fbc09ac1b3235bb7a38af8b4c5d1f68864a0fecb16d070a8b8200d54", length = 5 }
