noir = "1.0.0-rc.3"
bb = "7.0.0-nightly.20260927"

[library]
name = "emit-devnet"
version = "0.2.0"

# ------------------------------------------------------------ families (hand-written; freeze keeps them)

# The Emit V2 transfer (the JoinSplit): [ctx, cid, root, N0, N1, C0, C1, v_in, v_out, fee, payout_recipient, note_commitment];
# bound to the session's ctx (it recomputes it), the rest public, the note payload's commitment its link out.
[[family]]
layer = "emit"
name = "transfer"
members = ["transfer"]
link_out = { index = 11, link = "PayloadCommitment" }
binds = [{ slot = "ctx", index = 0 }]
public_from = 1
slots = ["cid", "root", "n0", "n1", "c0", "c1", "v_in", "v_out", "fee", "payout"]

[[circuit]]
label = "transfer"
version = "1.0.0"
system = "chonk"
role = "app"
status = "active"
bytecode_sha256 = "1f4f1f059eae99e1cd9329e9dd64a132526c5524686db4cec17f45805ac1fb25"
vk_sha256 = "3fd90cdf507e1b698f0cfb7d3645d79d0bdd8e40ae5211cb29d3bbd186e8c4c6"
vk_hash = "0x28e182ade77c7d2f1198c9ff2c838d38c646ae9ab53c0a334ecf4fffd72e92a7"

