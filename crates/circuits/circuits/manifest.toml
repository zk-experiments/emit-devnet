[[circuit]]
label = "transfer_holder"
version = "1.0.0"
system = "chonk"
role = "app"
status = "active"
bytecode_sha256 = "37ff7ef295bd1ddab5731127f09113bd9c2be3e8523d7b12069ff6e3f24d21e9"
vk_sha256 = "e4b6d37382a27efc2a52bb348ea537240b0aedb3b4c500682343572c5b46b8a2"
vk_hash = "0x1d5a4ffa9c5ddfb4cb5689b940dec9f2660afc83c04b89b77fedf22776e01dd1"

# The transfer of member_transfer: [ctx, holder_tag, cid, root, N0, N1, C0, C1, v_in, v_out, fee, payout_recipient,
# note_commitment]; both inputs held by one key, bound to the session's ctx and to the holder tag identity_member
# published (the same key registered), the rest public, the note payload's commitment its link out.
[[family]]
layer = "emit"
name = "transfer_holder"
members = ["transfer_holder"]
link_out = { index = 12, link = "PayloadCommitment" }
binds = [{ slot = "ctx", index = 0 }, { slot = "holder_tag", index = 1 }]
public_from = 2
slots = ["cid", "root", "n0", "n1", "c0", "c1", "v_in", "v_out", "fee", "payout"]

# The identity cache: prove the passport once (register, after eid's document step), then membership.
# register: [payload_commitment, leaf, expiry]; continues the document's DG1 commitment, leaf and expiry public.
[[family]]
layer = "identity_cache"
name = "register"
members = ["register"]
link_in = { index = 0, link = "PayloadCommitment" }
public_from = 1
slots = ["leaf", "expiry"]

# identity_member: [payload_commitment, identity_root, date, holder_tag]; a fresh commitment to the registered DG1
# for its envelope, the rest public.
[[family]]
layer = "identity_cache"
name = "member"
members = ["identity_member"]
link_out = { index = 0, link = "PayloadCommitment" }
public_from = 1
slots = ["identity_root", "date", "holder_tag"]

# ------------------------------------------------------------ wrapped layers (build.rs: noir_zk_codegen::wrapped)

# The identity layer: eid-circuits v0.8.0 (DSC, SOD and document steps).
[[family]]
layer = "eid"
name = "dsc"
source = "eid-circuits"

[[family]]
layer = "eid"
name = "sod"
source = "eid-circuits"

[[family]]
layer = "eid"
name = "document"
source = "eid-circuits"

# The channel layer: zk-encryption-circuits v0.1.0.
[[family]]
layer = "channel"
name = "session"
source = "zk-encryption"

[[family]]
layer = "channel"
name = "envelope"
source = "zk-encryption"

[[family]]
layer = "channel"
name = "note_envelope"
source = "zk-encryption"

# ------------------------------------------------------------ pipelines
# The session publishes ctx and C_t; the DG1 envelope, the transfer and the
# note envelope are bound to them. The document's DG1 commitment is consumed
# by its envelope before the transfer leaves the note's.

# A document, the session, DG1 sealed, the transfer, its note opening sealed: 32 slots.
[[pipeline]]
name = "identity_transfer"
positions = ["eid-circuits/eid/dsc", "eid-circuits/eid/sod", "eid-circuits/eid/document", "zk-encryption/channel/session", "zk-encryption/channel/envelope", "emit-devnet/emit/transfer", "zk-encryption/channel/note_envelope"]

# A transfer with no document: the session, the transfer, its note opening sealed.
[[pipeline]]
name = "transfer_only"
positions = ["zk-encryption/channel/session", "emit-devnet/emit/transfer", "zk-encryption/channel/note_envelope"]

# The passport proved once: the document, then its registration in the identity cache: 6 slots.
[[pipeline]]
name = "identity_register"
positions = ["eid-circuits/eid/dsc", "eid-circuits/eid/sod", "eid-circuits/eid/document", "emit-devnet/identity_cache/register"]

# A transfer by a registered holder: membership (a fresh DG1 commitment, the holder tag), the session, DG1
# sealed, the transfer bound to the tag, its note opening sealed: 31 slots.
[[pipeline]]
name = "member_transfer"
positions = ["emit-devnet/identity_cache/member", "zk-encryption/channel/session", "zk-encryption/channel/envelope", "emit-devnet/emit/transfer_holder", "zk-encryption/channel/note_envelope"]
