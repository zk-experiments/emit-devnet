[package]
name = "passport-groth16"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "passport-groth16"
path = "src/main.rs"

[features]
default = []
parallel = ["ark-ec/parallel", "ark-ff/parallel", "ark-poly/parallel", "ark-groth16/parallel", "ark-std/parallel", "dep:rayon"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom"]
threads = ["wasm", "parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
acir = { version = "=1.0.0-rc.5", features = ["bn254"] }
acvm = { version = "=1.0.0-rc.5", features = ["bn254"] }
bn254_blackbox_solver = "=1.0.0-rc.5"
ark-bn254 = "0.6"
ark-ec = "=0.6.0"
ark-ff = "0.6"
ark-poly = "0.6"
ark-groth16 = { version = "0.6", default-features = false, features = ["std"] }
ark-relations = "0.6"
ark-r1cs-std = "0.6"
ark-serialize = "0.6"
ark-std = { version = "0.6", features = ["std", "getrandom"] }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }
rayon = { version = "1.11", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
wasm-bindgen = { version = "=0.2.114", optional = true }
js-sys = { version = "=0.3.91", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[patch.crates-io]
ark-ec = { path = "vendor/ark-ec-0.6.0" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 3
