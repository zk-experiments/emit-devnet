[package]
name = "passport-provekit"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "passport-provekit"
path = "src/main.rs"

[features]
threads = ["dep:wasm-bindgen-rayon"]

[dependencies]
passport-groth16 = { path = "../groth16" }
anyhow = "1"
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-relations = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
postcard = { version = "1.1.1", features = ["use-std"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
rayon = "1.10"
provekit-backend-bn254 = { git = "https://github.com/worldfnd/ProveKit", rev = "893f6d5866d52124e12c4a90a71c0f4d625f083b", features = ["provekit_ntt"] }
provekit-common = { git = "https://github.com/worldfnd/ProveKit", rev = "893f6d5866d52124e12c4a90a71c0f4d625f083b" }
provekit-prover = { git = "https://github.com/worldfnd/ProveKit", rev = "893f6d5866d52124e12c4a90a71c0f4d625f083b" }
provekit-verifier = { git = "https://github.com/worldfnd/ProveKit", rev = "893f6d5866d52124e12c4a90a71c0f4d625f083b" }
whir = { git = "https://github.com/worldfnd/whir.git", rev = "d2b16529d0a4fad4f53d088281e9062898d35f5b", features = ["tracing", "rs_in_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"], optional = true }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
