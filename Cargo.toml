[workspace]
members = ["crates/circuits", "crates/node", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# noir-zk 0.3.3 (crates.io): layered registries, the generic pipeline kernels (the key hash a
# witness bb constrains), Chonk via bb's FFI. Every layer below is bound with the same release.
noir-zk-core = "=0.3.3"
noir-zk-backend = { version = "=0.3.3", features = ["packs", "http"] }
noir-zk-codegen = "=0.3.3"
# The identity layer: eid-circuits v0.8.2 (noir-zk 0.3.3; families eid/dsc, eid/sod, eid/document;
# RSA steps with a 2-bit windowed exponentiation since v0.8.1).
eid-circuits = { git = "https://github.com/zk-experiments/eid-circuits", tag = "v0.8.2", features = ["packs", "http"] }
eid-prover = { git = "https://github.com/zk-experiments/eid-circuits", tag = "v0.8.2" }
csca-registry = { git = "https://github.com/zk-experiments/csca-registry", tag = "v0.3.1" }
# The channel layer: zk-encryption v0.1.3 (noir-zk 0.3.3; frozen as zk-encryption@0.1.3, the session
# 6% smaller since v0.1.2; bytecode bundled).
zk-encryption-circuits = { git = "https://github.com/zk-experiments/zk-encryption", tag = "v0.1.3", features = ["serde"] }
emit-devnet-circuits = { path = "crates/circuits" }
ark-ff = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Witness solving and proving are unusably slow unoptimised (noir-zk's note).
[profile.dev]
opt-level = 3
