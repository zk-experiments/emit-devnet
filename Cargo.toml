[workspace]
members = ["crates/circuits", "crates/node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# noir-zk: layered registries, the generic pipeline kernels, Chonk via bb's FFI. Every layer below is
# bound with the same revision (the `feat/pipelines` branch, PR #6) until 0.3.0 is on crates.io.
noir-zk-core = { git = "https://github.com/zk-experiments/noir-zk", rev = "dd2d33f" }
noir-zk-backend = { git = "https://github.com/zk-experiments/noir-zk", rev = "dd2d33f", features = ["packs", "http"] }
noir-zk-codegen = { git = "https://github.com/zk-experiments/noir-zk", rev = "dd2d33f" }
# The identity layer: eid-circuits v0.8.0, draft PR #29 (branch feat/identity-layer).
eid-circuits = { git = "https://github.com/zk-experiments/eid-circuits", rev = "a0a9cce", features = ["packs", "http"] }
eid-prover = { git = "https://github.com/zk-experiments/eid-circuits", rev = "a0a9cce" }
csca-registry = { git = "https://github.com/zk-experiments/csca-registry", tag = "v0.3.1" }
# The channel layer: zk-encryption v0.1.0 (circuits bundled; the wallet library re-exported).
zk-encryption-circuits = { git = "https://github.com/zk-experiments/zk-encryption", tag = "v0.1.0", features = ["serde"] }
emit-devnet-circuits = { path = "crates/circuits" }
ark-ff = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Witness solving and proving are unusably slow unoptimised (noir-zk's note).
[profile.dev]
opt-level = 3
