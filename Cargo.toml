[workspace]
members = ["crates/node", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# noir-zk 0.3.3 (crates.io): layered registries, the generic pipeline kernels, Chonk via bb's FFI.
# Every layer below is bound with the same release.
noir-zk-core = "=0.3.3"
noir-zk-backend = { version = "=0.3.3", features = ["packs", "http"] }
# eid-prover renders the eid steps' inputs for a registration (the tag of the eid-circuits release
# emit-circuits wraps; eid-prover itself isn't on crates.io).
eid-prover = { git = "https://github.com/zk-experiments/eid-circuits", tag = "v0.8.3" }
csca-registry = { git = "https://github.com/zk-experiments/csca-registry", tag = "v0.3.1" }
# The channel layer: zk-encryption-circuits 0.1.5 (crates.io; bytecode bundled), the one
# emit-circuits wraps.
zk-encryption-circuits = { version = "=0.1.5", features = ["serde"] }
# The protocol (github.com/zk-experiments/emit-protocol): its values, the pool's ABI and the
# circuits' registry.
emit-protocol = "=0.1.0"
emit-protocol-abi = "=0.1.0"
emit-circuits = "=0.1.0"
ark-ff = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Witness solving and proving are unusably slow unoptimised (noir-zk's note).
[profile.dev]
opt-level = 3
