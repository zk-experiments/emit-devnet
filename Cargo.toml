[workspace]
members = ["crates/circuits", "crates/node", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# noir-zk 0.3.0 (crates.io): layered registries, the generic pipeline kernels, Chonk via bb's FFI.
# Every layer below is bound with the same release.
noir-zk-core = "=0.3.0"
noir-zk-backend = { version = "=0.3.0", features = ["packs", "http"] }
noir-zk-codegen = "=0.3.0"
# The identity layer: eid-circuits v0.8.0 (noir-zk 0.3.0; families eid/dsc, eid/sod, eid/document).
eid-circuits = { git = "https://github.com/zk-experiments/eid-circuits", tag = "v0.8.0", features = ["packs", "http"] }
eid-prover = { git = "https://github.com/zk-experiments/eid-circuits", tag = "v0.8.0" }
csca-registry = { git = "https://github.com/zk-experiments/csca-registry", tag = "v0.3.1" }
# The channel layer: zk-encryption v0.1.0 as PR #1 moves it onto noir-zk 0.3.0 (branch
# build/noir-zk-0.3.0; the circuits and their pins are v0.1.0's, bytecode bundled).
zk-encryption-circuits = { git = "https://github.com/zk-experiments/zk-encryption", rev = "8696562", features = ["serde"] }
emit-devnet-circuits = { path = "crates/circuits" }
ark-ff = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Witness solving and proving are unusably slow unoptimised (noir-zk's note).
[profile.dev]
opt-level = 3
