[workspace]
members = ["crates/node", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# noir-zk 0.3.3 (crates.io, patched below): layered registries, the generic pipeline kernels, Chonk via bb's FFI.
# Every layer below is bound with the same release.
noir-zk-core = "=0.3.3"
noir-zk-backend = { version = "=0.3.3", features = ["packs", "http"] }
# eid-prover renders the eid steps' inputs for a registration (the tag of the eid-circuits release
# emit-circuits wraps; eid-prover itself isn't on crates.io).
eid-prover = { git = "https://github.com/zk-experiments/eid-circuits", tag = "v0.8.3" }
csca-registry = { git = "https://github.com/zk-experiments/csca-registry", tag = "v0.3.1" }
# The channel layer: zk-encryption-circuits 0.1.5 (crates.io; bytecode bundled), the one
# emit-circuits wraps.
zk-encryption-circuits = { version = "=0.1.5", features = ["serde"] }
# The protocol (github.com/zk-experiments/emit-protocol): its values, the pool's ABI and the
# circuits' registry.
emit-protocol = "=0.1.0"
emit-protocol-abi = "=0.1.0"
emit-circuits = "=0.1.0"
ark-ff = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Witness solving and proving are unusably slow unoptimised (noir-zk's note).
[profile.dev]
opt-level = 3

# noir-zk on bb 7.0.0-nightly.20261110 / Noir 1.0.0-rc.5 (zk-experiments/noir-zk#11) and the
# emit-protocol built on it, until both are released: one noir-zk for every layer.
[patch.crates-io]
noir-zk-core = { git = "https://github.com/zk-experiments/noir-zk", rev = "0d022abf80cec1f2e28a7bc2008d0579af4ae141" }
noir-zk-kernels = { git = "https://github.com/zk-experiments/noir-zk", rev = "0d022abf80cec1f2e28a7bc2008d0579af4ae141" }
noir-zk-backend = { git = "https://github.com/zk-experiments/noir-zk", rev = "0d022abf80cec1f2e28a7bc2008d0579af4ae141" }
noir-zk-codegen = { git = "https://github.com/zk-experiments/noir-zk", rev = "0d022abf80cec1f2e28a7bc2008d0579af4ae141" }
emit-protocol = { git = "https://github.com/zk-experiments/emit-protocol", rev = "fcf30900219ca0382450fa6e6035bed944f0224a" }
emit-protocol-abi = { git = "https://github.com/zk-experiments/emit-protocol", rev = "fcf30900219ca0382450fa6e6035bed944f0224a" }
emit-circuits = { git = "https://github.com/zk-experiments/emit-protocol", rev = "fcf30900219ca0382450fa6e6035bed944f0224a" }
